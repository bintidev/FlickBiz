name: Weekly fetch

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd flickbiz_back
          pip install -r requirements.txt

      - name: Check environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
        run: |
          cd flickbiz_back
          echo "Python version:"
          python --version
          echo "DATABASE_URL set: ${{ secrets.DATABASE_URL != '' }}"
          echo "TMDB_API_KEY set: ${{ secrets.TMDB_API_KEY != '' }}"
          echo "SECRET_KEY set: ${{ secrets.SECRET_KEY != '' }}"
          python manage.py check --database default

      - name: Fetch movies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
        run: |
          cd flickbiz_back
          python manage.py fetch_movies --pages 3

      - name: Fetch series
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
        run: |
          cd flickbiz_back
          python manage.py fetch_series --pages 3

      - name: Update trends
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"
        run: |
          cd flickbiz_back
          python manage.py update_trends
