services:
  # Backend: Django REST API
  - type: web
    name: flickbiz-back
    runtime: python
    rootDir: flickbiz-back
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn flickbiz.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: flickbiz-back.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: flickbiz-db
          property: connectionString
      - key: TMDB_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://flickbiz-front.onrender.com

  # Frontend: React
  - type: web
    name: flickbiz-front
    runtime: static
    rootDir: flickbiz-front
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://flickbiz-back.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: flickbiz-db
    databaseName: flickbiz
    user: flickbiz_user
    plan: free
